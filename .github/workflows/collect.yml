name: Collect NAVER search trends

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect.py
      - test_collect.py
      - keywords.json
      - .github/workflows/collect.yml

permissions:
  contents: write

concurrency:
  group: naver-trend-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check collector
        run: python -m unittest -v test_collect.py
      - name: Collect
        id: collection
        continue-on-error: true
        env:
          NAVER_API_CLIENT_ID: ${{ secrets.NAVER_API_CLIENT_ID }}
          NAVER_API_CLIENT_SECRET: ${{ secrets.NAVER_API_CLIENT_SECRET }}
        run: python collect.py
      - name: Publish public JSON and collection status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/latest.json public/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NAVER trend collection status"
            git push
          fi
      - name: Report collection failure
        if: steps.collection.outcome == 'failure'
        run: |
          echo "::error::Collection failed. Check public/status.json and repository Secrets. Last successful data is preserved."
          exit 1

